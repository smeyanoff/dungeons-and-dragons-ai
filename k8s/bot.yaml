apiVersion: v1
kind: Secret
metadata:
  name: bot-secret
  namespace: dnd-ai
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: your_telegram_bot_token_here
  GIGACHAT_CLIENT_ID: your_gigachat_client_id
  GIGACHAT_CLIENT_SECRET: your_gigachat_client_secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: dnd-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bot
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bot
    spec:
      containers:
      - name: bot
        image: dnd-bot:latest
        imagePullPolicy: Always
        env:
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: bot-secret
              key: TELEGRAM_BOT_TOKEN
        - name: GIGACHAT_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: bot-secret
              key: GIGACHAT_CLIENT_ID
        - name: GIGACHAT_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: bot-secret
              key: GIGACHAT_CLIENT_SECRET
        - name: DATABASE_URL
          value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: QDRANT_HOST
          value: qdrant
        - name: QDRANT_PORT
          value: "6334"
        - name: GIGACHAT_MODEL
          value: "GigaChat"
        - name: GIGACHAT_AUTH_URL
          value: "https://ngw.devices.sberbank.ru:9443"
        - name: GIGACHAT_API_URL
          value: "https://gigachat.devices.sberbank.ru/api/v1"
        - name: GIGACHAT_SCOPE
          value: "GIGACHAT_API_PERS"
        - name: TZ
          value: "Europe/Moscow"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bot
  namespace: dnd-ai
spec:
  selector:
    app: bot
  ports:
  - port: 8080
    targetPort: 8080
    name: http
